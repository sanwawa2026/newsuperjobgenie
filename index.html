<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperJobGenie - AI Job Match & Career Pivot Intelligence</title>
    <meta name="description" content="Next-gen AI job match and career pivot intelligence system. Solves 153-character truncation with full 8,000+ char scraping, accurate match scoring, and strategic career pivots." />
    <meta property="og:title" content="SuperJobGenie - AI Job Match & Career Pivot Intelligence" />
    <meta property="og:description" content="Next-gen AI job match and career pivot intelligence system. Solves 153-character truncation with full 8,000+ char scraping, accurate match scoring, and strategic career pivots." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully suppress benign Vite HMR WebSocket disconnect errors in iframe environment
      (function() {
        function isViteHmrNoise(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('WebSocket') !== -1 ||
            s.indexOf('vite:ws') !== -1 ||
            s.indexOf('@vite/client') !== -1 ||
            s.indexOf('client.mjs') !== -1 ||
            s.indexOf('vite') !== -1 && s.indexOf('failed') !== -1
          );
        }

        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, colNo, error) {
          var errorStr = (msg || '') + ' ' + (url || '') + ' ' + (error ? (error.stack || error.message || '') : '');
          if (isViteHmrNoise(errorStr)) {
            return true; // Prevents default browser and frame error logging
          }
          if (origOnError) {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (isViteHmrNoise(msg + ' ' + stack)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var msg = event.message || '';
          var filename = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          if (isViteHmrNoise(msg + ' ' + filename + ' ' + stack)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
